# Recommended capability configuration for Codex. Merge these into the config.toml the product
# already reads; nothing in this repository writes to your configuration.
#
# Both settings are commented examples of options that support the delivered operation boundaries.
# Installing this fragment does not enable either setting or change your personal configuration.
# `workspace-write` confines writes to the active workspace directory (it bounds writing, not
# reading). `on-request` prompts before outward or out-of-workspace actions.
# sandbox_mode = "workspace-write"
# approval_policy = "on-request"
