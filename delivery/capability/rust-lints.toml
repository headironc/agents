# Recommended lint configuration for a project that adopts policy/rust.md. Merge into the
# Cargo.toml it belongs with; nothing in this repository writes a consuming project's files.
#
# Each entry below is verified on rustc and Clippy to reject violating code while accepting
# compliant code. Rules that Clippy does not enforce reliably remain prose in policy/rust.md.

[lints.rust]
# Enforces non_camel_case_types, non_snake_case, and non_upper_case_globals (does not cover
# macro_rules! names, which remain governed by policy/rust.md).
nonstandard_style = "deny"

[lints.clippy]
# Require `is_empty` alongside a public `len`.
len_without_is_empty = "deny"

# Require `new` to return Self, and `new()` with no arguments to be paired with `Default`.
new_ret_no_self = "deny"
new_without_default = "deny"

# Disallow `unwrap` and `expect` in production code.
unwrap_used = "deny"
expect_used = "deny"

# Note: `upper_case_acronyms` and `wrong_self_convention` are intentionally omitted because they
# do not fire reliably on `pub struct HTTP;` or `into_*(&self)` on the pinned toolchain; those
# conventions remain enforced by review under policy/rust.md.
